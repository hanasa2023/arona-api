name: Daily Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  make-request:
    runs-on: ubuntu-latest
    steps:
      - name: Update Raid Line Img
        run: |
          response=$(curl -s -w "\n%{http_code}" \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
              -H "Origin: https://arona.hanasaki.tech" \
              -H "Referer: https://arona.hanasaki.tech/" \
              -H "Connection: keep-alive" \
              -H "Sec-Fetch-Dest: empty" \
              -H "Sec-Fetch-Mode: cors" \
              -H "Sec-Fetch-Site: same-origin" \
              -b "cookie.txt" \
              -c "cookie.txt" \
              -L \
              https://arona.hanasaki.tech/api/raid/update)
            status_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            
            echo "Status code: $status_code"
            echo "Response body: $body"
            
            if [ "$status_code" -ne 200 ]; then
              echo "Request failed with status $status_code"
              exit 1
            fi
